[package]
name = "jdiff"
version = "0.1.0"
edition = "2024"
authors = ["Peter Williams <pwil3058@bigpond.net.au> <pwil3058@gmail.com>"]
description = "CLI utility to generate human-reviewable JSON patch sets for directories and Git repositories."

[dependencies]
json_diff_lib = { path = "../json_diff_lib" }

clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
dirs = "7.0.0"
